<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 500" width="1240" height="500" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Where the populations' narrowness went: the transport flow's sampled variance as first measured and under the corrected conventions</title>
  <desc id="desc">The real per-gene variance is a fixed bar of 0.824. As first measured, with sampled counts divided by a fixed depth and a library size counted over all genes, the flow's sampled variance split into decoder count noise 0.538 and latent 0.140, leaving 0.146 missing and coverage of 0.375. Normalized like the data, with the library size counted over the modeled genes, it splits into decoder count noise 0.518 and latent 0.256, leaving 0.050 missing and coverage of 0.771. The latent part nearly doubles, and the decoder still supplies about two-thirds of the spread.</desc>

  <defs>
    <pattern id="gap" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1240" height="500" fill="#fbfbf9"/>

  <!-- scale: 1000 px = 0.824 -->

  <!-- ============ reference: the real spread ============ -->
  <text x="60" y="40" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">The real spread of held-out cells</text>
  <rect x="60" y="56" width="1000" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="560" y="84" text-anchor="middle" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#334155">variance = 0.824   (an 80% interval should cover 0.80 of the cells)</text>

  <!-- ============ as first measured ============ -->
  <text x="60" y="152" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">As first measured: coverage 0.375</text>
  <text x="60" y="176" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">sampled counts divided by a fixed depth; library size counted over all genes</text>
  <rect x="60" y="188" width="653" height="76" rx="8" fill="#e7f6ee" stroke="#34a97b" stroke-width="1.6"/>
  <text x="386" y="218" text-anchor="middle" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#065f46">decoder count noise</text>
  <text x="386" y="242" text-anchor="middle" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#065f46">0.538  (shared)</text>
  <rect x="713" y="188" width="170" height="76" rx="8" fill="#ecebfd" stroke="#6366f1" stroke-width="1.6"/>
  <text x="798" y="218" text-anchor="middle" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#3730a3">latent</text>
  <text x="798" y="242" text-anchor="middle" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#3730a3">0.140</text>
  <rect x="883" y="188" width="177" height="76" rx="8" fill="url(#gap)" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="971" y="224" text-anchor="middle" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#64748b">missing</text>
  <text x="971" y="246" text-anchor="middle" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">0.146</text>

  <!-- ============ corrected ============ -->
  <text x="60" y="316" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Normalized like the data: coverage 0.771</text>
  <text x="60" y="340" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">each sampled cell divided by its own total, at the real depth; library size counted over the 5,000 modeled genes</text>
  <rect x="60" y="352" width="629" height="76" rx="8" fill="#e7f6ee" stroke="#34a97b" stroke-width="1.6"/>
  <text x="374" y="382" text-anchor="middle" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#065f46">decoder count noise</text>
  <text x="374" y="406" text-anchor="middle" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#065f46">0.518  (about two-thirds of the spread)</text>
  <rect x="689" y="352" width="311" height="76" rx="8" fill="#ecebfd" stroke="#6366f1" stroke-width="2.4"/>
  <text x="844" y="382" text-anchor="middle" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#3730a3">latent</text>
  <text x="844" y="406" text-anchor="middle" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#3730a3">0.256  (nearly doubled)</text>
  <rect x="1000" y="352" width="60" height="76" rx="8" fill="url(#gap)" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="1030" y="396" text-anchor="middle" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">0.050</text>

  <text x="60" y="470" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Transport flow, seed 0; per-gene variance in log1p-CP10K on each pair's top 20 genes, averaged over the 20 held-out pairs.</text>
</svg>
