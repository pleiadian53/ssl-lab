[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssllab"
version = "0.1.0"
description = "Self-supervised learning lab: JEPA representation learning extended into a sampleable generative model."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
