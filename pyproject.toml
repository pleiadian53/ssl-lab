[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssllab"
version = "0.1.0"
description = "Self-supervised learning lab: JEPA representation learning extended into a sampleable generative model."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]
# Single-cell perturbation pipeline (Phase 1+). Heavy, processing-time only:
# imported inside examples/perturbation_response/00_process_norman.py, never by
# the loader or tests' light path. Install with: pip install -e ".[perturb]"
perturb = ["anndata>=0.10", "scanpy>=1.10", "scikit-misc>=0.3", "pertpy>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
